<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Handover Dashboard</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='5' y='5' width='90' height='90' fill='white' stroke='%231a1a1a' stroke-width='8'/><text x='50' y='76' font-family='Georgia, serif' font-size='72' font-weight='bold' fill='%231a1a1a' text-anchor='middle'>M</text></svg>">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Spartan:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --font-display: 'League Spartan', sans-serif;
            --font-body: 'Inter', sans-serif;
            --bg: #ffffff;
            --surface: #f5f5f5;
            --border: #e5e5e5;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --primary: hsl(360, 89%, 38%);
            --primary-hover: hsl(360, 89%, 32%);
            --primary-light: hsl(360, 89%, 98%);
            --danger: hsl(0, 84%, 60%);
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            color: var(--text-main);
            background: var(--surface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 28px;
            text-align: center;
        }

        .brand h1 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .brand p { color: var(--text-muted); font-size: 0.9rem; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .btn-primary {
            width: 100%;
            margin-top: 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .pw-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .pw-wrap input {
            padding-right: 46px;
        }

        .pw-toggle {
            position: absolute;
            right: 6px;
            width: auto;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 8px;
            display: flex;
            align-items: center;
            border-radius: 8px;
        }

        .pw-toggle:hover { color: var(--text-main); }
        .pw-toggle svg { width: 20px; height: 20px; }

        .error {
            display: none;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            margin-top: 18px;
        }
    </style>
</head>

<body>
    <form class="login-card" id="loginForm" onsubmit="doLogin(event)">
        <div class="brand">
            <img src="/assets/majestic-logo.png" alt="Majestic Logo" style="height: 56px; width: auto; object-fit: contain; margin-bottom: 12px;">
            <h1>Handover Dashboard</h1>
            <p>Sign in to continue</p>
        </div>

        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" autofocus required>

        <label for="password">Password</label>
        <div class="pw-wrap">
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="Show password">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
        </div>

        <div class="error" id="errorBox"></div>

        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>

        <p style="margin-top:18px; text-align:center; font-size:0.82rem; color:#6e6e73;">
            Forgot your password? Ask your manager or an admin to reset it for you.
        </p>
    </form>

    <script>
        const EYE_OFF_SVG = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>`;
        const EYE_SVG = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>`;
        function togglePw(btn) {
            const inp = btn.parentElement.querySelector('input');
            if (inp.type === 'password') { inp.type = 'text'; btn.innerHTML = EYE_OFF_SVG; }
            else { inp.type = 'password'; btn.innerHTML = EYE_SVG; }
        }

        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const err = document.getElementById('errorBox');
            err.style.display = 'none';
            btn.disabled = true;
            btn.innerText = 'Signing in…';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json().catch(() => ({}));
                    err.innerText = data.error || 'Sign in failed';
                    err.style.display = 'block';
                }
            } catch (_) {
                err.innerText = 'Network error. Please try again.';
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Sign in';
            }
        }
    </script>
</body>

</html>
